name: '渲染自定义工厂拓扑'
description: '按 LAN CIDR / Web 凭据改写工厂拓扑副本；无自定义输入时为 no-op。输出生效配置路径（host 侧，未自定义时为空）'
inputs:
  lan_cidr:
    description: 'LAN 网段 CIDR（网关=首可用地址，DHCP 池=其余主机位，自动推导）'
    required: false
    default: ''
  web_admin_user:
    description: 'Web 管理用户'
    required: false
    default: ''
  web_admin_password:
    description: 'Web 管理密码'
    required: false
    default: ''
outputs:
  effective_config_path:
    description: '生效工厂拓扑路径；未自定义时为空（消费方回退仓库默认）'
    value: ${{ steps.render.outputs.path }}
runs:
  using: composite
  steps:
    - id: render
      shell: bash
      env:
        TOPOLOGY_SRC: ${{ github.workspace }}/configs/landscape_init.toml
        TOPOLOGY_DEST: ${{ github.workspace }}/work/effective-landscape_init.toml
        LAN_CIDR: ${{ inputs.lan_cidr }}
        WEB_ADMIN_USER: ${{ inputs.web_admin_user }}
        WEB_ADMIN_PASSWORD: ${{ inputs.web_admin_password }}
      run: |
        set -euo pipefail
        if [[ -z "${LAN_CIDR}" && -z "${WEB_ADMIN_USER}" ]]; then
          echo "path=" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        bash "${GITHUB_ACTION_PATH}/../../scripts/render-effective-topology.sh"
        echo "path=${TOPOLOGY_DEST}" >> "${GITHUB_OUTPUT}"