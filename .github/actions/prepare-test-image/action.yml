# =============================================================================
# 测试镜像准备（composite action）：解压 xz 镜像 + 选定 IMAGE_PATH + 安装测试依赖
# 前置：output/ 目录已含 *.img.xz 镜像产物
# 产出：GITHUB_ENV.IMAGE_PATH 指向解压后的 raw 镜像
# =============================================================================
name: 'Prepare test image'
description: '解压 xz 镜像并安装 QEMU 测试依赖'

runs:
  using: 'composite'
  steps:
    - name: 解压镜像
      shell: bash
      run: |
        set -euo pipefail
        cd output
        shopt -s nullglob
        xz_images=(*.img.xz)
        if [[ ${#xz_images[@]} -eq 0 ]]; then
          echo "output 中未找到 *.img.xz 镜像产物" >&2
          exit 1
        fi
        for f in "${xz_images[@]}"; do
          xz -T0 -d -k "$f"
        done

    - name: 选择测试镜像
      shell: bash
      run: |
        set -euo pipefail
        source build.env
        img="$(ls "output/${IMAGE_ID}"*.img | head -n1)"
        echo "IMAGE_PATH=${img}" >> "${GITHUB_ENV}"

    - name: 安装测试依赖
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        # systemd-ukify/binutils/xz/zstd：OTA 测试伪造版本物料
        # （objcopy 抽 PE 段 + ukify 重排 + tar --zstd 重打包根载荷）
        # systemd-boot-efi：ukify 的 PE stub（/usr/lib/systemd/boot/efi/linuxx64.efi.stub），
        # 缺包时 ukify 报 FileNotFoundError（与 build.sh 宿主侧校验同源）
        sudo apt-get install -y sshpass socat curl jq \
          qemu-system-x86 ovmf qemu-utils \
          systemd-ukify systemd-boot-efi binutils xz-utils zstd \
          passt

    - name: 升级 passt（net_backend=passt 依赖 --map-host-tcp，noble 包过旧）
      shell: bash
      run: |
        set -euo pipefail
        # noble 的 passt 无 --map-host-tcp（bootstrap 3222→22 异端口映射硬依赖），
        # 优先替换为 passt.top 官方静态构建；不可达时保留 apt 版本（后端能力
        # 探测会自动回退 slirp，不阻塞测试）
        if curl -fsSL --max-time 90 https://passt.top/builds/latest/x86_64/passt -o /tmp/passt-bin; then
          sudo install -m 0755 /tmp/passt-bin /usr/local/bin/passt
        else
          echo "passt.top 静态构建不可达，保留 apt 版本"
        fi
        passt --version 2>&1 | head -n1 || true
        passt --help 2>&1 | grep -o -- '--map-host-tcp' || echo "NO --map-host-tcp（将回退 slirp）"
