# =============================================================================
# 测试镜像准备（composite action）：解压 xz 镜像 + 选定 IMAGE_PATH + 安装测试依赖
# 前置：output/ 目录已含 *.img.xz 镜像产物
# 产出：GITHUB_ENV.IMAGE_PATH 指向解压后的 raw 镜像
# =============================================================================
name: 'Prepare test image'
description: '解压 xz 镜像并安装 QEMU 测试依赖'

runs:
  using: 'composite'
  steps:
    - name: 解压镜像
      shell: bash
      run: |
        set -euo pipefail
        cd output
        shopt -s nullglob
        xz_images=(*.img.xz)
        if [[ ${#xz_images[@]} -eq 0 ]]; then
          echo "output 中未找到 *.img.xz 镜像产物" >&2
          exit 1
        fi
        for f in "${xz_images[@]}"; do
          xz -T0 -d -k "$f"
        done

    - name: 选择测试镜像
      shell: bash
      run: |
        set -euo pipefail
        source build.env
        img="$(ls "output/${IMAGE_ID}"*.img | head -n1)"
        echo "IMAGE_PATH=${img}" >> "${GITHUB_ENV}"

    - name: 安装测试依赖
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        # systemd-ukify/binutils/xz/zstd：OTA 测试伪造版本物料
        # （objcopy 抽 PE 段 + ukify 重排 + tar --zstd 重打包根载荷）
        # systemd-boot-efi：ukify 的 PE stub（/usr/lib/systemd/boot/efi/linuxx64.efi.stub），
        # 缺包时 ukify 报 FileNotFoundError（与 build.sh 宿主侧校验同源）
        sudo apt-get install -y sshpass socat curl jq \
          qemu-system-x86 ovmf qemu-utils \
          systemd-ukify systemd-boot-efi binutils xz-utils zstd \
          passt

    - name: 升级 passt（net_backend=passt 依赖 --map-host-tcp，noble 包过旧）
      shell: bash
      run: |
        set -euo pipefail
        # noble 的 passt (2024.02) 无 --map-host-tcp（bootstrap 3222→22 异端口
        # 映射硬依赖）。固定 Debian 官方 pool 的 trixie 2025.05 版（版本 +
        # SHA256 双锁定；该版早于最新版的 pesto 化改造）。校验失败即失败，
        # 不静默换源；后端能力探测在测试内自动回退 slirp
        passt_deb="passt_0.0~git20250503.587980c-2+deb13u1_amd64.deb"
        passt_url="http://deb.debian.org/debian/pool/main/p/passt/${passt_deb}"
        passt_sha256="dfbca023b20c84a3345e36bbbe182c18bf262583d31386fc7e3050a708850f0d"
        curl -fsSL --max-time 120 "${passt_url}" -o "/tmp/${passt_deb}"
        echo "${passt_sha256}  /tmp/${passt_deb}" | sha256sum -c -
        sudo apt-get install -y "/tmp/${passt_deb}"
        passt --version 2>&1 | head -n1
        passt --help 2>&1 | grep -o -- '--map-host-tcp' || echo "NO --map-host-tcp（将回退 slirp）"
