# root A 槽 — 系统本体，EROFS 只读（lower 层）。
# 运行期：/var(btrfs) 独立挂载 + fstab overlay 全根增量层（改动落 /var）
#   /etc            → 构建期渲染完毕；运行期改动经 overlay 增量持久化
#   /var/lib/landscape → landscape 配置与状态（详见 mkosi.postinst 迁移说明）
#
# 槽位/版本语义：
#   标签 = sysupdate 版本簿记（sysupdate.d(5)：写入后按 Target MatchPattern
#   重命名为 basalt_<版本>；标签 "_empty" = 空槽）。UKI cmdline
#   绑 root=PARTLABEL=basalt_<版本>（build.sh 按构建版本追加；
#   工厂版本 1 = 本标签）→ 与 sysupdate 簿记同源，单一事实 = 版本号。
#
# 压缩：repart 默认对 erofs 不传 -z（mkfs.erofs 无 -z = 完全不压缩），
# 必须显式声明 Compression=。lz4hc 是 Android 生产同款：
# 解码端就是普通 lz4，压缩比更高而运行时开销不变。
[Partition]
Type=root
Label=basalt_1
Format=erofs
Compression=lz4hc
Minimize=guess
CopyFiles=/

# 部署后首启增长语义：EROFS 内容固定，A 槽不参与增长（镜像内 repart.d
# 无 A 槽尺寸指令），剩余空间由 btrfs /var 分配 —— 见
# mkosi.extra/usr/lib/repart.d/；A/B 构建期均定稿为实测+余量（对称余量，
# 见 build.sh），任意次 sysupdate 写入不溢出