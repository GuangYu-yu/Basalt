# var — 唯一数据分区（btrfs：zstd/校验和/子卷）
# Subvolumes=/DefaultSubvolume= 为 repart.d(5) 原生指令（≥255/256），空白分隔
# 多绝对路径，man 明文不创建目录本身（MakeDirectories=/CopyFiles= 承载），
# 且仅支持 --offline=yes + btrfs-progs ≥ 6.12（#38750 即 257.7 offline 路径
# 的实际 bug，#38366 修复并随 257-stable 后期点版本发布）→ mkosi.conf 须
# RepartOffline=yes（仅影响构建期 repart；initrd 首启 repart 不受此参数影响）。
# @images 独立子卷：不用 :ro flag——构建期 CopyFiles 需写种子，且属性须由
# 运行期切换（images-lock 收敛 / sysupdate wrapper 窗口），构建期固化则无法
# 解锁。ro 语义由 btrfs 属性层承载（fstab + images-lock.service +
# systemd-sysupdate.service.d/10-images-rw.conf）。
# CopyFiles=/var:/@data —— /var 种子入 @data；/@os-staging 行由 build.sh pass2
# 渲染（目标 /@images）。MakeDirectories= 空白分隔多路径（冒号 pair 语法仅属
# CopyFiles=/MakeSymlinks=）；/@os/images 为运行期 @images 挂载点占位目录。
# 刻意无 MountPoint=：repart 自动生成的 fs UUID fstab 段与两阶段构建
# 的盘上实际 UUID 失配（根因见 fstab /var 条目注释）；/var 挂载由 fstab
# 手写 PARTLABEL=var。
[Partition]
Type=var
Label=var
Format=btrfs
Subvolumes=/@os /@data /@images
DefaultSubvolume=/@data
CopyFiles=/var:/@data
MakeDirectories=/@os/overlay/upper /@os/overlay/work /@os/images /@images
Minimize=guess
# 必需：写入 GPT bit 59（GrowFileSystem 标志）。repart 仅对置位该标志的
# 已存在分区做首启增长——缺失时 initrd 92-var-grow.conf 的 Weight=100
# 静默 no-op（实测 "No changes."），var 恒为紧凑尺寸 → OTA 瞬态写入 EIO。
# 文件系统级扩展由 fstab x-systemd.growfs 承接。
GrowFileSystem=yes
