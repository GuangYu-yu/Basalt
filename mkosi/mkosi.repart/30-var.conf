# var — 唯一数据分区（btrfs：zstd/校验和/子卷）
# Subvolumes=/DefaultSubvolume= 为 repart.d(5) 原生指令（≥255/256），但 man 明文
# 仅支持 --offline=yes + btrfs-progs ≥ 6.12（#38750 即 257.7 offline 路径的实际
# bug，#38366 修复并随 257-stable 后期点版本发布）→ mkosi.conf 须 RepartOffline=yes
# （仅影响构建期 repart；initrd 首启 repart 不受此参数影响）。
# CopyFiles=/var:/@data —— /var 种子入 @data；/@os-staging 行由 build.sh pass2 渲染。
# MakeDirectories= 空白分隔多路径（冒号 pair 语法仅属 CopyFiles=/MakeSymlinks=）。
[Partition]
Type=var
Label=var
Format=btrfs
Subvolumes=/@os /@data
DefaultSubvolume=/@data
CopyFiles=/var:/@data
MakeDirectories=/@os/overlay/upper /@os/overlay/work /@os/images
Minimize=guess
MountPoint=/var:"subvol=@data,compress=zstd:1,noatime,x-systemd.growfs"