# var — 唯一数据分区（btrfs 单分区单池：版本化部署 + 载荷 + 状态）
# Subvolumes=/DefaultSubvolume= 为 repart.d(5) 原生指令（≥255/256），空白分隔
# 多绝对路径，man 明文不创建目录本身（MakeDirectories=/CopyFiles= 承载），
# 且仅支持 --offline=yes + btrfs-progs ≥ 6.12（#38750 即 257.7 offline 路径
# 的实际 bug，#38366 修复并随 257-stable 后期点版本发布）→ mkosi.conf 须
# RepartOffline=yes（仅影响构建期 repart；initrd 首启 repart 不受此参数影响）。
#
# 子卷布局（/usr-etc-var 三分哲学）：
#   /@data        用户/应用数据 + 设备身份（DefaultSubvolume；/var 的持久层，
#                 含 lib/basalt/state 身份三件套普通目录）
#   /@landscape   应用载荷（landscape-webserver + static/ + 工厂默认 toml），
#                 与 root OTA 解耦独立更新
#   /root-basalt-<v>  版本化根部署子卷（build.sh pass2 渲染注入 Subvolumes=
#                 列表 + CopyFiles=/ 灌装 + ExcludeFilesTarget 排除载荷暂存
#                 与 /boot /efi——见文件尾渲染段；工厂首装仅此一个部署）
#
# CopyFiles=/:/root-basalt-<v> 的内容边界（repart v257 源码语义核对）：
#   - APIVFS/临时目录（/proc /sys /dev /tmp /run /var/tmp）内容由 repart
#     内建 denylist 排除（目录本身保留为空）——与 mkosi Format=tar 的
#     tar_exclude_apivfs_tmp 完全同构，工厂子卷与 OTA 子卷内容一致
#   - /var 包种子一并进入部署子卷（运行期被 @data 挂载遮蔽，无害；与
#     OTA tar.xz 同边界，保持两种安装途径同源）
#   - ExcludeFilesTarget= 按目标路径映射排除（v257.2 config 表确认可用）：
#     对 CopyFiles=/ 的目标 /root-basalt-<v> 生效，不阻断显式源路径的其他
#     CopyFiles 条目（ExcludeFiles= 源路径语义会整体跳过命中条目——源码
#     make_copy_files_denylist() 的 path_startswith(source, e) return 1 路径，
#     故必须用 Target 变体）
#
# 刻意无 MountPoint=：repart 自动生成的 fs UUID fstab 段与两阶段构建
# 的盘上实际 UUID 失配（根因见 fstab /var 条目注释）；/var 挂载由 fstab
# 手写 PARTLABEL=var。
[Partition]
Type=var
Label=var
Format=btrfs
Subvolumes=/@data /@landscape
DefaultSubvolume=/@data
CopyFiles=/var:/@data
Minimize=guess
# 必需：写入 GPT bit 59（GrowFileSystem 标志）。repart 仅对置位该标志的
# 已存在分区做首启增长——缺失时 initrd 92-var-grow.conf 的 Weight=100
# 静默 no-op（实测 "No changes."），var 恒为紧凑尺寸 → OTA 瞬态写入 EIO。
# 文件系统级扩展由 fstab x-systemd.growfs 承接。
GrowFileSystem=yes
# build.sh pass2 渲染追加（.orig 备份由通用暂存-恢复机制承载）：
#   Subvolumes 行注入 /root-basalt-<v>
#   CopyFiles=/:/root-basalt-<v>
#   ExcludeFilesTarget=/root-basalt-<v>/@landscape-staging /root-basalt-<v>/boot /root-basalt-<v>/efi
#   CopyFiles=/@landscape-staging:/@landscape
