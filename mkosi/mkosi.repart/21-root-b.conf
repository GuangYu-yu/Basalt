# root B 槽 — 非活动槽，构建期只占位不填内容（CopyFiles 为空）。
# 尺寸由构建期自适应定稿渲染为 A 槽实测大小（build.sh 写入 REPART_DIR
# 拷贝；此处仓库版本为无尺寸兜底）。构建期必须即全尺寸：分区起点不可
# 移动，B 夹在 A/var 之间，最小化占位会使首启扩 B 物理不可达。
# 此后由 systemd-sysupdate 写入新版本（标签 "_empty" = sysupdate.d(5)
# 规定的空槽候选语义）。
[Partition]
Type=root
Label=_empty
Format=erofs
Minimize=guess