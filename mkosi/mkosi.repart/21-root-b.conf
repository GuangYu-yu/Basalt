# root B 槽 — 非活动槽，构建期只占位不填内容（CopyFiles 为空）。
# 首启 initrd 内 repart 将其扩到与 A 槽实测一致（构建期渲染进
# 91-root-b.conf，见 build.sh 自适应定稿；repart.d(5) 按 Type 序配对：
# 90-root-a 消费 A 槽，本槽由 91-root-b 消费），此后由 systemd-sysupdate
# 写入新版本（标签 "_empty" = sysupdate.d(5) 规定的空槽候选语义）。
[Partition]
Type=root
Label=_empty
Format=erofs
Minimize=guess