# ESP — 存放 UKI（*.efi，含常驻 rescue 条目）。构建期自适应：repart 在
# [Min,Max] 内按内容实际大小产出（单份主 UKI + rescue），build.sh 按
# max(UKI) × (InstancesMax+1) + rescue 实测二次 repart 定稿
# （+1 = 更新过程瞬态）。此处仅设上下限兜底。
# CopyFiles 必需：存在 mkosi.repart/ 时默认定义整体弃用（v26 文档明示），
# 缺失则 ESP 为空分区。两源合并进 ESP：
#   /boot/EFI  → 主 UKI（mkosi 安装位）
#   /efi       → systemd-boot + rescue UKI + loader
# /boot 根的 Debian 传统内核文件（vmlinuz/System.map/config/initrd.img）
# 与 /boot/loader/entries（传统 BLS，UKI 模式不用）不入 ESP。
[Partition]
Type=esp
Label=ESP
Format=vfat
CopyFiles=/boot/EFI:/EFI
CopyFiles=/efi:/
SizeMinBytes=64M
SizeMaxBytes=1G