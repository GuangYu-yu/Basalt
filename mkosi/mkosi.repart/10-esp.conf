# ESP — 存放 UKI（*.efi）。构建期自适应：repart 在 [Min,Max] 内按内容实际大小
# 产出（单份 UKI），build.sh 提取后 ×ESP_SLOTS（A/B + fallback 预留）二次
# repart 定稿。此处仅设上下限兜底。
# CopyFiles 必需：存在 mkosi.repart/ 时默认定义整体弃用（v26 文档明示），
# 缺失则 ESP 为空分区 —— /boot(UKI) 与 /efi(systemd-boot) 汇入 ESP 根。
[Partition]
Type=esp
Label=ESP
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=64M
SizeMaxBytes=1G