# First-boot host key generation in state dir (HostKey target in
# sshd_config.d/60-state-hostkeys.conf):
# 1. Debian sshd-keygen.service is gated by ConditionFirstBoot, but initrd
#    machine-id lives in /run; switch_root after PID1 is considered initialized
#    → ConditionFirstBoot always false.
# 2. Drop-in ExecStartPre is appended after the main unit's sshd -t; keygen
#    must reset the sequence (empty ExecStartPre= before it) to run before
#    config test. Keygen is handled by basalt-state-init (idempotent, runs
#    before this unit); this drop-in only preserves the order contract.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'for k in /var/lib/basalt/state/ssh/ssh_host_ed25519_key /var/lib/basalt/state/ssh/ssh_host_rsa_key; do [ -f "$k" ] || exit 1; done'
ExecStartPre=/usr/sbin/sshd -t