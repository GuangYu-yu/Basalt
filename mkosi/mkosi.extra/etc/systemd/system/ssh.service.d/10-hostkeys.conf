# 首启生成 host key 到 state 目录（HostKey 指向见
# sshd_config.d/60-state-hostkeys.conf）：
# 1. Debian 自带 sshd-keygen.service 用 ConditionFirstBoot 门控，而 initrd
#    阶段 PID1 的临时 machine-id 在 /run，最终 PID1 视为已初始化 → 恒 false
# 2. drop-in 的 ExecStartPre 追加在主单元 sshd -t 之后，keygen 必须重置
#    序列（ExecStartPre= 空行）才能先于配置测试执行
# keygen 由 basalt-state-init 承担（幂等，先于本单元）；此处仅保留配置测试
# 顺序契约。ssh-keygen -t 生成到显式路径，已存在时跳过（-N 空口令 + -f）
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'for k in /var/lib/basalt/state/ssh/ssh_host_ed25519_key /var/lib/basalt/state/ssh/ssh_host_rsa_key; do [ -f "$k" ] || exit 1; done'
ExecStartPre=/usr/sbin/sshd -t
