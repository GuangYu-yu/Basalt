# First-boot host key generation in state dir (HostKey target in
# sshd_config.d/60-state-hostkeys.conf):
# 1. Debian sshd-keygen.service is gated by ConditionFirstBoot, but initrd
#    machine-id lives in /run; after switch_root PID1 considers itself
#    already initialized → ConditionFirstBoot is always false here.
# 2. This drop-in uses ExecStartPre= (empty) to reset the main unit's
#    ExecStartPre chain, then redefines the order explicitly: key existence
#    check → sshd -t config test. Reset is necessary because keygen must run
#    before sshd -t, but the default main-unit chain is sshd -t first.
#    Keygen itself is handled by basalt-state-init (idempotent, runs before
#    this unit); the check here is a hard guard to fail startup early when
#    host keys are missing.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'for k in /var/lib/basalt/state/ssh/ssh_host_ed25519_key /var/lib/basalt/state/ssh/ssh_host_rsa_key; do [ -f "$k" ] || exit 1; done'
ExecStartPre=/usr/sbin/sshd -t