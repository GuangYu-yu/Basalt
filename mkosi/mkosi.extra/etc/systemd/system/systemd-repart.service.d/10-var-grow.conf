# Repart: explicit device + definitions dir.
#   - The system root partition / is a btrfs deployment subvolume (no separate
#     block device). Without an explicit arg, repart's backing-device detection
#     can fail, and stock SuccessExitStatus=76 silently treats that as
#     success → explicit /dev/disk/by-partlabel/var device.
#   - Explicit --definitions decouples from device (PARTLABEL=var is sole
#     source of truth). After repart grows the partition, /var's
#     x-systemd.growfs expands the btrfs filesystem on mount.
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-repart --definitions=/etc/repart.d --dry-run=no /dev/disk/by-partlabel/var