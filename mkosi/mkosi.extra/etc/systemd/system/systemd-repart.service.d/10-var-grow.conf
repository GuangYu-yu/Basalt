# repart 显式设备 + 定义目录：
#   - 真实根 / 为 overlay，无设备参数时 backing device 探测可能失败，
#     stock SuccessExitStatus=76 会把失败静默为成功 → 显式设备
#   - 显式 --definitions 与设备解耦（PARTLABEL=var 为单一事实源）
# 首启增长分区后，/var 的 x-systemd.growfs 在挂载时扩展 btrfs。
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-repart --definitions=/etc/repart.d /dev/disk/by-partlabel/var
