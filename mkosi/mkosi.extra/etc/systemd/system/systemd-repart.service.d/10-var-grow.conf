# Repart explicit device + definitions dir:
#   - Root / is a btrfs deployment subvolume (no independent device arg); without
#     it, backing device detection can fail and stock SuccessExitStatus=76
#     silently treats failure as success → explicit device.
#   - Explicit --definitions decoupled from device (PARTLABEL=var is sole source
#     of truth). After repart grows the partition, /var's x-systemd.growfs
#     expands btrfs on mount.
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-repart --definitions=/etc/repart.d --dry-run=no /dev/disk/by-partlabel/var