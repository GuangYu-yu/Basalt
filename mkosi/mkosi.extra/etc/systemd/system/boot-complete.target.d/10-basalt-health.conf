# boot-complete.target ← business success criterion (systemd.special(7) official
# paradigm: "required to succeed" units precede target and are required by it).
# basalt-boot-health.service (After=landscape-router) failure/timeout → target
# not reached → systemd-bless-boot.service doesn't run → tries not decremented.
# landscape-router explicit Requires: process not up → target also fails.
[Unit]
Requires=basalt-boot-health.service landscape-router.service