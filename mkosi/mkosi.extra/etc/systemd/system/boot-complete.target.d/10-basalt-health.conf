# boot-complete.target ← 业务成功判据（systemd.special(7) 官方范式：
# "required to succeed" 单元排在 target 之前并由 target Requires）。
# basalt-boot-health.service（After=landscape-router）失败/超时 → target
# 不达成 → systemd-bless-boot.service 不运行 → tries 不被去计数。
# landscape-router 显式 Requires：进程起不来时 target 同样失败。
[Unit]
Requires=basalt-boot-health.service landscape-router.service
