# var(btrfs) claims all remaining space (the sole data partition).
# Partition growth timing: initrd-stage systemd-repart running against an
# offline-expanded disk reports a stale "usable" value even with PADDING=0B
# (empiric: both passes see old size). The same repart run correctly identifies
# all free space and grows when reading the real device; empiric: 365M → 1.4G.
# After partition growth, /var's x-systemd.growfs in fstab expands the btrfs
# filesystem. Explicit device + definition dir are in
# systemd-repart.service.d/10-var-grow.conf.
[Partition]
Type=var
Weight=100