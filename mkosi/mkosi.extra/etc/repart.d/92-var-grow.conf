# var(btrfs) claims all remaining space (the sole data partition).
# Root-side growth: initrd early repart sees stale usable value for offline
# disk expansion (empiric PADDING=0B both passes); root-side correctly identifies
# all free space and grows (empiric 365M → 1.4G). Works with fstab /var's
# x-systemd.growfs for filesystem-level expansion; device + definition in
# systemd-repart.service.d/10-var-grow.conf.
[Partition]
Type=var
Weight=100