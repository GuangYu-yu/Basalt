# Host key persistence = @data state directory (stable across deployments,
# eliminates TOFU key storm on every deployment flip). HostKey directive fully
# replaces compiled default paths (/etc/ssh) once set; keys generated first
# boot by basalt-state-init.service (scheduled before this unit).
HostKey /var/lib/basalt/state/ssh/ssh_host_ed25519_key
HostKey /var/lib/basalt/state/ssh/ssh_host_rsa_key