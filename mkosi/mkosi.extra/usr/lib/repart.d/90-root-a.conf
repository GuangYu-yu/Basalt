# 镜像内 repart 定义 —— 部署后 initrd 内 systemd-repart 消费。
#
# ⚠ 配对算法（repart.d(5) 原文）：定义按文件名排序，与**同 Type** 的既有
# 分区**依次**配对（第 1 个同型分区 → 第 1 个同型定义，第 2 个 → 第 2 个…）。
# Label 不参与匹配（仅创建时写入）。因此：
#   90-root-a.conf 消费第 1 块 root 分区（A 槽，无尺寸指令 = 保持不动）
#   91-root-b.conf  落到第 2 块 root 分区（B 槽，尺寸由构建期实测派生 ——
#                   见 build.sh 自适应定稿；仓库内无尺寸版本 = 无副作用的
#                   未暂存兜底，避免任何魔数）
[Partition]
Type=root
