# OTA orchestration wrapper (deployment subvolume created natively by sysupdate
# on pool top-level mount /var/lib/basalt/pool, fully rw):
#   1. ota-prep: btrfs resize max (fallback when growfs first-boot window was
#      missed, idempotent no-op on already-grown); failure via `;` doesn't block,
#      success/failure carried by sysupdate result itself.
#   2. systemd-sysupdate update: alphabetical transfer install order (70-root
#      subvolume → 80-uki entry point lands last).
#   3. ota-select: bootctl set-oneshot locks new deployment candidate (boot
#      determinism on first boot).
# No ExecStartPre/ExecStopPost: under Type=simple ExecStopPost timing isn't
# guaranteed immediately after main process exit; single-flow sh is structural
# guarantee, not implementation assumption.
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/lib/basalt/ota-prep; /usr/lib/systemd/systemd-sysupdate update && /usr/lib/basalt/ota-select'
# Main process replaced by sh, so child sysupdate's sd_notify (EXTEND_TIMEOUT
# for large downloads against TimeoutStartSec) gets rejected by stock
# NotifyAccess=main → relax to all.
NotifyAccess=all