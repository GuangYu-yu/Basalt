# OTA 更新编排 wrapper（旧 @images rw 窗口机制已随文件轮转管线废弃——
# 部署子卷由 sysupdate 在池顶层挂载 /var/lib/basalt/pool 原生创建，全程 rw）：
#   1. ota-prep：btrfs resize max（growfs 首启窗口错过的兜底，幂等 no-op），
#      失败经 `;` 不阻断，成败由 sysupdate 自身结果承载
#   2. systemd-sysupdate update：按 transfer 字母序安装（70-root 子卷 →
#      80-uki 入口最后落位）
#   3. ota-select：bootctl set-oneshot 锁定新部署候选条目（首启确定性）
# 不用 ExecStartPre/ExecStopPost：Type=simple 下 ExecStopPost 时序不保证
# 紧跟主进程退出，单控制流 sh 是结构保证而非实现假设。
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/lib/basalt/ota-prep; /usr/lib/systemd/systemd-sysupdate update && /usr/lib/basalt/ota-select'
# 主进程由 sysupdate 换为 sh 后，子进程 sysupdate 的 sd_notify（EXTEND_TIMEOUT，
# 长下载防 TimeoutStartSec）按 stock NotifyAccess=main 会被拒 → 放宽为 all。
NotifyAccess=all
