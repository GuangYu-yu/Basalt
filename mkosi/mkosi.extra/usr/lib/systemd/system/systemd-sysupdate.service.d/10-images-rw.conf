# @images rw 窗口：只读保护为 btrfs 子卷属性（fstab 挂载保持 rw，属性承载 ro）。
# 不能用 mount remount,ro：@images/@os/@data 共享同一 btrfs superblock，后者
# 保持 rw（@os 为 overlay upper 宿主）时 remount,ro 必 EBUSY（实测）。
# wrapper 在同一控制进程内 property ro=false → sysupdate → trap EXIT 恢复
# ro=true：rw 窗口结构性覆盖实际写入（含中途失败/被杀，trap 必达）。
# 不用 ExecStartPre/ExecStopPost：Type=simple 下 ExecStopPost
# 时序不保证紧跟主进程退出（依赖 systemd 生命周期实现细节），wrapper 是
# 结构保证而非实现假设。
# property 属 btrfs-progs ioctl：stock 单元 CapabilityBoundingSet 已含
# CAP_SYS_ADMIN，无需放宽沙箱。
[Service]
ExecStart=
# 更新前三步就绪（同控制流，trap 保底恢复 ro）：
#   1. repart 增长 var 分区（boot 早期 repart 对离线扩盘的 usable 识别
#      不可靠——实测 PADDING=0B 静默 No changes，数分钟后才可见 1G 空闲，
#      故不能依赖 boot 时 systemd-repart.service，须在更新前重试）
#   2. btrfs resize 扩展文件系统（growfs 只在挂载时跑一次，错过窗口则
#      分区已长而 fs 未长）
#   3. sysupdate 本体
# 实测 v2 更新需瞬态 ~197M + xz 下载 124M，var 紧凑态仅 66M 可用 → EIO。
ExecStart=/bin/sh -c 'trap "btrfs property set -ts /var/lib/basalt/images ro true" EXIT; btrfs property set -ts /var/lib/basalt/images ro false && /usr/bin/systemd-repart --definitions=/etc/repart.d /dev/disk/by-partlabel/var; btrfs filesystem resize max /var; /usr/lib/systemd/systemd-sysupdate update'
# 主进程由 sysupdate 换为 sh 后，子进程 sysupdate 的 sd_notify（EXTEND_TIMEOUT，
# 长下载防 TimeoutStartSec）按 stock NotifyAccess=main 会被拒 → 放宽为 all。
NotifyAccess=all
