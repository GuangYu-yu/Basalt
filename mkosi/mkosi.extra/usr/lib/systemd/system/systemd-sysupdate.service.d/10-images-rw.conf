# @images rw 窗口：只读保护为 btrfs 子卷属性（fstab 挂载保持 rw，属性承载 ro）。
# 不能用 mount remount,ro：@images/@os/@data 共享同一 btrfs superblock，后者
# 保持 rw（@os 为 overlay upper 宿主）时 remount,ro 必 EBUSY（实测）。
# wrapper 在同一控制进程内 property ro=false → sysupdate → trap EXIT 恢复
# ro=true：rw 窗口结构性覆盖实际写入（含中途失败/被杀，trap 必达）。
# 不用 ExecStartPre/ExecStopPost：Type=simple 下 ExecStopPost
# 时序不保证紧跟主进程退出（依赖 systemd 生命周期实现细节），wrapper 是
# 结构保证而非实现假设。
# property 属 btrfs-progs ioctl：stock 单元 CapabilityBoundingSet 已含
# CAP_SYS_ADMIN，无需放宽沙箱。
[Service]
ExecStart=
# 空间就绪（repart 轮询重试 + btrfs resize，详见 ota-prep）与更新同控制流，
# trap 保底恢复 ro；repart/resize 失败不阻断（`|| true`/`;`），由 sysupdate
# 自身结果承载成败。
ExecStart=/bin/sh -c 'trap "btrfs property set -ts /var/lib/basalt/images ro true" EXIT; btrfs property set -ts /var/lib/basalt/images ro false && /usr/lib/basalt/ota-prep; /usr/lib/systemd/systemd-sysupdate update'
# 主进程由 sysupdate 换为 sh 后，子进程 sysupdate 的 sd_notify（EXTEND_TIMEOUT，
# 长下载防 TimeoutStartSec）按 stock NotifyAccess=main 会被拒 → 放宽为 all。
NotifyAccess=all
