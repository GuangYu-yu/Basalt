# @images rw 窗口：镜像子卷默认 ro，更新期临时 remount
# stock 单元为 Type=simple + ExecStart=/usr/lib/systemd/systemd-sysupdate update
# （systemd 源码 units/ 原文）。wrapper 在同一控制进程内 remount rw →
# sysupdate → trap EXIT 恢复 ro：rw 窗口结构性覆盖实际写入（含中途失败/被杀，
# trap 必达）。不用 ExecStartPre/ExecStopPost：Type=simple 下 ExecStopPost
# 时序不保证紧跟主进程退出（依赖 systemd 生命周期实现细节），wrapper 是
# 结构保证而非实现假设。
# remount 属挂载操作：stock 单元 CapabilityBoundingSet 已含 CAP_SYS_ADMIN、
# SystemCallFilter 已含 @mount，无需放宽沙箱。
[Service]
ExecStart=
ExecStart=/bin/sh -c 'trap "mount -o remount,ro /var/lib/basalt/images" EXIT; mount -o remount,rw /var/lib/basalt/images && /usr/lib/systemd/systemd-sysupdate update'
# 主进程由 sysupdate 换为 sh 后，子进程 sysupdate 的 sd_notify（EXTEND_TIMEOUT，
# 长下载防 TimeoutStartSec）按 stock NotifyAccess=main 会被拒 → 放宽为 all。
NotifyAccess=all
