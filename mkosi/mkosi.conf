# =============================================================================
# mkosi.conf — Basalt 主配置
#
# 分区布局见 mkosi.repart/（ESP + var；root 分区已由 EROFS 文件轮转取代，
# 根镜像以版本化文件存于 var 分区 @os 子卷）；UKI 引导由
# Bootloader=systemd-boot + [Content] 配置完成；ToolsTree=default 提供
# 构建工具树；文件轮转更新定义见 mkosi.extra/usr/lib/sysupdate.d/
# =============================================================================

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Build]
# 用 mkosi 自带工具树提供 ukify/sbsign/mkfs 等构建工具，
# 不受宿主与目标 distro 差异影响（mkosi 官方推荐形态）
ToolsTree=default
# Subvolumes=/（mkosi.repart/30-var.conf）的 offline 前置：repart.d(5) man 明文
# 要求 --offline=yes + btrfs-progs ≥ 6.12（#38750/#38366，随 257-stable 后期
# 点版本修复）。仅影响构建期 repart；initrd 首启 repart 不受此参数影响
RepartOffline=yes

[Output]
Format=disk
ImageId=basalt
# 显式声明拆分产物：uki（ESP 自适应定稿实测）、initrd（模块门禁）、
# kernel（rescue UKI 原料，build.sh 收集）。pass1 的 partitions 由 build.sh
# CLI 追加（拆出裸 EROFS 根镜像工件）；主配置保持此值，终盘构建不拆出
# 多余分区工件
SplitArtifacts=uki,initrd
# 输出目录由 build.sh 以 --output-dir 统一指向 work/

[Content]
Bootable=yes
# 显式采用 mkosi.images/initrd 子镜像产物作为 initrd（官方 root-verity.md
# 同范式）。缺失此行时 mkosi 静默改用默认 initrd，子镜像的全部自定义
# （overlay 组装/repart dropin）不生效
Initrds=%O/initrd
# systemd-boot 仅作 boot order 管理器：
#   - mkosi UKI profiles 是"单 PE 多 .profile 段 + Cmdline 追加"（mkosi 手册原文），
#     直连固件（Bootloader=uki）只能启动基础 profile → 无法做槽位/版本选择
#   - systemd-boot 按 UKI 文件名中的版本排序，默认启动最新版 = 更新后自动切换；
#     旧版本条目仍在菜单中 = 回滚路径
Bootloader=systemd-boot

# 内核命令行基础行；版本相关参数由 build.sh 按构建版本 CLI 追加（追加语义）：
#   root=/dev/disk/by-partlabel/var rootflags=subvol=@os → initrd 内
#     fstab-generator 生成 sysroot.mount（btrfs @os：镜像与 overlay 层宿主；
#     root= 采用 man 明示的设备节点路径形态）
#   basalt.image=basalt_<v>.erofs → initrd-root-overlay.service loop 只读挂
#     为 overlay lowerdir（版本→镜像在构建期经 cmdline 精确配对，无需任何
#     运行期胶水守护；与 sysupdate 70-root.transfer 的版本簿记同源）
#   console → readiness 契约：串口日志定位首启故障（systemd-getty-generator
#     自动在 ttyS0 起 getty），最后一个 console= 才是 /dev/console
KernelCommandLine=console=tty0 console=ttyS0,115200n8
                   quiet loglevel=3

# 内核模块三层分治（v26 源码语义：kernel-modules initrd 的输入是
# KernelInitrdModules=，非主 KernelModules=；列表按行/逗号切分，一行一条，
# 空格组会被当成单个 glob 静默匹配不到任何模块）：
#   ① base initrd = mkosi.images/initrd 子镜像（Include=mkosi-initrd 默认集）
#   ② kernel-modules initrd = KernelInitrdModules=（见下），只守启动链
#   ③ 根树 /usr/lib/modules = KernelModules=（见下），守运行/数据面
#
# kernel-modules initrd 白名单（②）：virtio/存储控制器/半虚拟化 +
# EROFS/Btrfs/VFAT/overlay/loop/autofs4（sysroot 与 overlay 组装链）；
# NIC 仅半虚拟化型号（initrd 排障），数据面 NIC 属根树契约。
# wireless/Bluetooth 排除与根树契约一致（check-initrd-modules.py 的
# forbidden 不相交判断）
KernelInitrdModules=
    loop
    erofs
    btrfs
    vfat
    overlay
    autofs4
    virtio_blk
    virtio_scsi
    virtio_pci
    virtio_net
    ahci
    sd_mod
    nvme
    ata_piix
    vmw_pvscsi
    mptspi
    mpt3sas
    hv_vmbus
    hv_storvsc
    hv_netvsc
    xen_blkfront
    -net/bluetooth/
    -net/wireless/
    -drivers/net/wireless/

# 根树白名单（③，v26 语义：mkosi 以 modinfo 依赖闭包裁剪并重建 depmod）：
#   default     → 展开 mkosi-initrd 内置清单（上游维护：virtio/ahci/nvme/sd_mod/
#                 btrfs/overlay/vfat/nls/erofs/crypto(含 crc32c)/autofs4 等）
#   loop        → EROFS 文件轮转：运行期 loop 挂根镜像（防御性显式声明，
#                 mkosi-initrd 默认核心清单已含 loop，免疫上游清单变动）
#   net/ + drivers/net/ → 网络子系统整目录保留，数据面功能（sched/clsact/
#                 cls_bpf、netfilter、xfrm、wireguard、8021q、ppp、bonding、
#                 macvlan、vxlan 等）自动继承，无需逐个列举
#   -排除       → 路由器不需要的网络子系统（WiFi/BT/RPC/WAN 协议栈等）；
#                 匹配顺序敏感：最后匹配优先，排除须置于正向条目之后
#   存储条目    → 各平台存储控制器/半虚拟化驱动
KernelModules=
    default
    loop
    net/
    drivers/net/
    -net/bluetooth/
    -net/wireless/          # cfg80211/mac80211，仅 WiFi 驱动需要
    -net/mac80211/          # mac80211 与 cfg80211 是兄弟目录，依赖闭包会把
                            # cfg80211 拉回根树（路径在 net/wireless/ 之外）
    -net/ceph/
    -net/rxrpc/
    -net/tipc/
    -net/nfc/
    -net/smc/
    -net/sctp/
    -net/dccp/
    -net/atm/
    -net/ieee802154/
    -net/mac802154/
    -net/6lowpan/
    -net/9p/
    -net/openvswitch/
    -net/rds/
    -net/phonet/
    -net/can/
    -net/x25/
    -net/appletalk/
    -net/rfkill/
    -net/lapb/
    -net/nsh/
    -net/ax25/              # 业余无线电 AX.25
    -net/batman-adv/        # 网状网络
    -net/hsr/               # 高可用无缝冗余（工业以太网）
    -net/ife/               # 中间字段封装
    -net/kcm/               # 内核连接复用
    -net/llc/               # IEEE 802.2 逻辑链路控制（废弃）
    -net/netrom/            # 业余无线电 NET/ROM
    -net/qrtr/              # Qualcomm 远程传输
    -net/rose/              # 业余无线电 ROSE
    -net/mpls/              # MPLS 多协议标签交换
    -net/dns_resolver/      # 内核 DNS 解析（仅 cifs/nfs 依赖）
    -net/key/               # PF_KEY（IPsec 旧管理接口，xfrm 不需要）
    -net/psample/           # 包采样（act_sample 依赖，数据面未用）
    -drivers/net/wireless/  # WiFi 驱动全集（连带固件依赖，体积最大）
    -drivers/net/can/
    # 无头路由器多余子系统（目录审计暴露：default 清单依赖闭包拉回）
    -drivers/gnss/          # GNSS 接收器
    -drivers/gpu/           # GPU/DRM（drm_buddy 等 default 条目拉回）
    -drivers/media/         # 媒体/摄像头（uvc/videobuf2 等 default 条目拉回）
    -drivers/nvdimm/        # 非易失性内存
    -drivers/pcmcia/        # PCMCIA（废弃）
    -drivers/ssb/           # 博通 SSD 总线
    -drivers/thunderbolt/   # Thunderbolt
    -drivers/uio/           # 用户空间 I/O
    -drivers/md/            # 软 RAID/设备映射（单盘 btrfs，无 md/dm）
    -drivers/parport/       # 并口（废弃）
    # 存储控制器与半虚拟化驱动
    ata_piix
    vmw_pvscsi
    mptspi
    mpt3sas
    hv_vmbus
    hv_storvsc
    hv_netvsc
    xen_blkfront

# 闭包残留兜底：KernelModules= 排除后，v26 依赖闭包仍会以
# todo={builtin, 过滤集} + modinfo 依赖扩展把被排除子系统的模块拉回
# required（删除循环 if m in required: continue 保留）。RemoveFiles= 在
# run_depmod 之后、make_disk 之前执行（v26 __init__.py remove_files =
# root.glob + rmtree），精确删除协议栈残留目录，补齐"无多余"契约；
# glob 无匹配时幂等无害，路径跨内核版本稳定。新残留由门禁 forbidden
# （自动派生 KernelModules= 排除项）发现后在此追加——与 KernelModules=
# 是"排除 + 闭包兜底"两层，门禁强制同步（漏改则构建红）。
RemoveFiles=
    /usr/lib/modules/*/kernel/net/wireless/
    /usr/lib/modules/*/kernel/drivers/net/wireless/
    /usr/lib/modules/*/kernel/net/phonet/
    /usr/lib/modules/*/kernel/net/rfkill/
    /usr/lib/modules/*/kernel/net/ax25/
    /usr/lib/modules/*/kernel/net/ife/
    /usr/lib/modules/*/kernel/net/llc/
    /usr/lib/modules/*/kernel/drivers/gnss/
    /usr/lib/modules/*/kernel/drivers/gpu/
    /usr/lib/modules/*/kernel/drivers/nvdimm/
    /usr/lib/modules/*/kernel/drivers/pcmcia/
    /usr/lib/modules/*/kernel/drivers/ssb/
    /usr/lib/modules/*/kernel/drivers/thunderbolt/
    /usr/lib/modules/*/kernel/drivers/uio/
    /usr/lib/modules/*/kernel/net/mpls/
    /usr/lib/modules/*/kernel/net/dns_resolver/
    /usr/lib/modules/*/kernel/net/key/
    /usr/lib/modules/*/kernel/net/psample/
    /usr/lib/modules/*/kernel/drivers/md/
    /usr/lib/modules/*/kernel/drivers/parport/

Packages=systemd
         systemd-sysv
         systemd-repart
         udev
         kmod
         dbus
         openssh-server
         iproute2
         ifupdown     # networking.service（/etc/network/interfaces 唯一事实）
         chrony
         ca-certificates
         curl
         unzip         # 仅构建期 postinst.chroot 解压 static.zip（解压后即删）；chroot 内
                       # 不可见 BuildPackages，故只能留在 Packages=
         pciutils      # readiness 契约：lspci
         ethtool       # readiness 契约 + 排障
         tcpdump       # 数据面排障
         nano          # 最小交互编辑器（现场排障）
         btrfs-progs   # /var 为 btrfs，运行时扩容需要其用户态工具
         libstdc++6    # landscape-webserver 链接 C++ 运行时
         dosfstools
         erofs-utils   # root 为 EROFS：构建期 mkfs.erofs 由 ToolsTree 提供，
                       # 目标机仅需内核驱动（trixie 6.12 CONFIG_EROFS_FS=y）+ 排障工具
         linux-image-amd64
         # systemd-boot 的 EFI 二进制（v26 文档：Debian 系需装 systemd-boot-efi）
         systemd-boot-efi
         # sysupdate 二进制与 systemd-sysupdate.timer（trixie 由该包提供，
         # packages.debian.org contents 检索确认；缺失则 postinst enable 静默失效）
         systemd-container

# nftables/iptables 用户态有意不装：landscape 数据面为纯 eBPF（XDP/TC +
# eBPF map 定向，官方文档明示无 iptables、无用户态数据路径）

# RootPassword 由 build.sh 通过 --root-password 注入（CLI 覆盖优先于文件）
Autologin=no

# 三行保留注释作为未来升级路径；启用前先运行 `mkosi genkeys`
[Validation]
#SecureBoot=yes
#SecureBootKey=mkosi.key
#SecureBootCertificate=mkosi.crt
Checksum=yes

[Runtime]
# `mkosi qemu` 冒烟即用
KVM=yes