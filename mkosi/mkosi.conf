# =============================================================================
# mkosi.conf — Basalt 主配置
#
# 分区布局见 mkosi.repart/（同时服务首启扩容）；UKI 引导由
# Bootloader=systemd-boot + [Content] 配置完成；ToolsTree=default 提供
# 构建工具树；A/B 原子更新定义见 mkosi.sysupdate/ 与
# mkosi.extra/usr/lib/sysupdate.d/
# =============================================================================

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Build]
# 用 mkosi 自带工具树提供 ukify/sbsign/mkfs 等构建工具，
# 不受宿主与目标 distro 差异影响（mkosi 官方推荐形态）
ToolsTree=default
# 在线构建（非离线），分区写入更稳；磁盘大时可改 yes 走离线扇区写入
RepartOffline=no

[Output]
Format=disk
ImageId=basalt
# 显式声明拆分产物（mkosi v26 的 compat 默认值恰好也是 uki+kernel+initrd，
# 但那是隐式契约，上游调整默认值会同时断掉 basalt.efi/basalt.initrd 两个消费方：
# 前者供 sysupdate OTA，后者供 tests/check-initrd-modules.py 模块门禁）
SplitArtifacts=uki,initrd
# 输出目录由 build.sh 以 --output-dir 统一指向 work/

[Content]
Bootable=yes
# 显式采用 mkosi.images/initrd 子镜像产物作为 initrd（官方 root-verity.md
# 同范式）。缺失此行时 mkosi 静默改用默认 initrd（无任何子镜像自定义），
# overlay 组装/repart dropin 全部失效 —— 历史性启动失败根因
Initrds=%O/initrd
# systemd-boot 仅作 boot order 管理器：
#   - mkosi UKI profiles 是"单 PE 多 .profile 段 + Cmdline 追加"（mkosi 手册原文），
#     直连固件（Bootloader=uki）只能启动基础 profile → 无法做槽位/版本选择
#   - systemd-boot 按 UKI 文件名中的版本排序，默认启动最新版 = 更新后自动切换；
#     旧版本条目仍在菜单中 = 回滚路径
Bootloader=systemd-boot

# 内核命令行：
#   root=PARTLABEL=basalt_<版本>：
#     sysupdate 写入 root 后按 Target MatchPattern 给分区贴版本标签
#     （sysupdate.d(5)：标签承载版本），版本在构建期已知 → UKI 自描述，
#     与 sysupdate 的版本簿记同源（单一事实 = 版本号）。build.sh 按构建
#     版本追加此参数（mkosi CLI 的 KernelCommandLine 追加语义）；工厂
#     构建（无 --version）缺省绑 _1，与 mkosi.repart/20-root-a.conf 的
#     Label=basalt_1 一致。
#   console → readiness 契约：串口日志定位首启故障（systemd-getty-generator
#     自动在 ttyS0 起 getty），最后一个 console= 才是 /dev/console
KernelCommandLine=console=tty0 console=ttyS0,115200n8
                   quiet loglevel=3

# 内核模块白名单（v26 语义，mkosi 以 modinfo 依赖闭包裁剪根树并重建 depmod；
# kernel-modules initrd 与根分区使用同一份裁剪结果，天然一致）：
#   default     → 展开 mkosi-initrd 内置清单（上游维护：virtio/ahci/nvme/sd_mod/
#                 btrfs/overlay/vfat/nls/erofs/crypto(含 crc32c)/autofs4 等）
#   net/ + drivers/net/ → 按子系统整目录保留（黑名单语义的正面重写）：
#                 sched(clsact/cls_bpf/act_*)、netfilter、ipv4/6、xfrm、
#                 wireguard、8021q、ppp、bonding、macvlan、vxlan 等自动继承，
#                 上游新增数据面功能不再需要补清单
#   -排除       → 老版黑名单的删除清单（mkosi 排除语法重写，顺序敏感：
#                 最后匹配优先，必须置于正向条目之后）
KernelModules=
    default
    net/
    drivers/net/
    -net/bluetooth/
    -net/wireless/          # cfg80211/mac80211，仅 WiFi 驱动需要
    -net/sunrpc/
    -net/ceph/
    -net/rxrpc/
    -net/tipc/
    -net/nfc/
    -net/smc/
    -net/sctp/
    -net/dccp/
    -net/atm/
    -net/ieee802154/
    -net/mac802154/
    -net/6lowpan/
    -net/9p/
    -net/openvswitch/
    -net/rds/
    -net/l2tp/
    -net/phonet/
    -net/can/
    -net/x25/
    -net/appletalk/
    -net/rfkill/
    -net/lapb/
    -net/nsh/
    -drivers/net/wireless/  # WiFi 驱动全集（最大头，连带固件依赖）
    -drivers/net/can/
    # ── 存储与 Hypervisor 半虚拟化 ──
    ata_piix
    ata_generic
    vmw_pvscsi
    mptspi
    mpt3sas
    hv_vmbus
    hv_storvsc
    hv_netvsc
    xen_blkfront

Packages=systemd
         systemd-sysv
         systemd-repart
         udev
         kmod
         dbus
         openssh-server
         iproute2
         ifupdown     # networking.service（/etc/network/interfaces 唯一事实）
         chrony
         ca-certificates
         curl
         unzip
         pciutils      # readiness 契约：lspci
         ethtool       # readiness 契约 + 排障
         tcpdump       # 数据面排障
         nano          # 最小交互编辑器（现场排障）
         btrfs-progs   # /var 为 btrfs，运行时扩容需要其用户态工具
         libstdc++6    # landscape-webserver 链接 C++ 运行时
         dosfstools
         erofs-utils   # root 为 EROFS：构建期 mkfs.erofs 由 ToolsTree 提供，
                       # 目标机仅需内核驱动（trixie 6.12 CONFIG_EROFS_FS=y）+ 排障工具
         linux-image-amd64
         # systemd-boot 的 EFI 二进制（v26 文档：Debian 系需装 systemd-boot-efi）
         systemd-boot-efi
         # sysupdate 二进制与 systemd-sysupdate.timer（trixie 由该包提供，
         # packages.debian.org contents 检索确认；缺失则 postinst enable 静默失效）
         systemd-container

# RootPassword 由 build.sh 通过 --root-password 注入（CLI 覆盖优先于文件）
Autologin=no

# 三行保留注释作为未来升级路径；启用前先运行 `mkosi genkeys`
[Validation]
#SecureBoot=yes
#SecureBootKey=mkosi.key
#SecureBootCertificate=mkosi.crt
Checksum=yes

[Runtime]
# `mkosi qemu` 冒烟即用
KVM=yes