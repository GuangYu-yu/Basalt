# =============================================================================
# initrd 子镜像 —— 通过主镜像 mkosi.conf 的 Initrds=%O/initrd 采用为 initrd
# （v26 无"名为 initrd 的子镜像自动生效"语义，未声明 Initrds= 时 mkosi
# 静默构建并使用默认 initrd，本目录全部自定义失效）。
#
# 职责（btrfs 部署子卷架构）：
#   1. systemd-repart 在 initrd 内完成 var 分区扩容：定义在 initrd 自身
#      /etc/repart.d（99-console.conf 显式 --definitions=/etc/repart.d，不落 /sysroot 前缀）；
#      dropin 排序于 sysroot.mount 之后（var 即 sysroot，先挂载以定位 backing 盘）
#   2. basalt-initrd-sysrw：sysroot.mount 前把引导部署子卷的 ro 属性翻回
#      false（回滚路径——ro 子卷挂载后无 rw 选项可用，先挂后改死锁）
#   3. basalt-initrd-state-bind：sysroot.mount 后 bind mount 设备 machine-id
#      （@data 暂存挂载 + 文件 bind，switch_root 前完成，pid1 即见稳定身份）
#   4. basalt-rescue-select：basalt.rescue=1 激活，动态发现最高版本部署子卷
#      并挂为 /sysroot（rescue UKI 的 cmdline 无 root=，本单元是唯一 /sysroot
#      提供者；失败即 initrd emergency，rescue 语义最后兜底）
# =============================================================================
[Include]
Include=mkosi-initrd

[Content]
# 内核模块三层分治：kernel-modules initrd 来自主镜像 KernelInitrdModules=
# （只守启动链），根树模块由主镜像 KernelModules= 裁剪（运行/数据面）；
# 本子镜像自身 = base initrd（mkosi-initrd 默认集）

# initrd 内 repart 需要用户态工具（mkosi-initrd 默认不含）；
# btrfs-progs：sysrw/rescue-select 的 btrfs property set（ro 翻转）需要
# 用户态 ioctl 工具，mkosi-initrd 默认不含
Packages=systemd-repart
         btrfs-progs

# btrfs 早期加载在 mkosi.extra/etc/modules-load.d/btrfs.conf（mkosi
# ModulesLoad= 不写入 initrd 子镜像，须用 mkosi.extra）

# initrd emergency/rescue shell 可达性：sulogin 读 initrd 自身 /etc/shadow
#（默认 root 锁定 → "root account is locked"，emergency 只有静态提示无 shell，
# 实测 SSH 失联时串口取证链在此断死）。与测试 SSH 密码同源，仅覆盖测试构建。
RootPassword=landscape