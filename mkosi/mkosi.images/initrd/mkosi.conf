# =============================================================================
# initrd 子镜像 —— 通过主镜像 mkosi.conf 的 Initrds=%O/initrd 采用为 initrd
# （v26 无"名为 initrd 的子镜像自动生效"语义，未声明 Initrds= 时 mkosi
# 静默构建并使用默认 initrd，本目录全部自定义失效）。
#
# 职责（overlay 根必须在 initrd 组装，原因见
# mkosi.images/initrd/mkosi.extra/.../initrd-root-overlay.service 头注）：
#   1. systemd-repart 在 initrd 内完成 var 分区扩容（stock 排序于
#      sysroot.mount 之前，此时未挂载，无在线扩容风险）—— 设备侧定义
#      （92-var-grow.conf）随本子镜像烘焙进 initrd 自身
#   2. initrd-root-overlay.service 组装 overlay 全根（EROFS 文件 lower）
# =============================================================================
[Include]
Include=mkosi-initrd

[Content]
# 内核模块三层分治：kernel-modules initrd 来自主镜像 KernelInitrdModules=
# （只守启动链），根树模块由主镜像 KernelModules= 裁剪（运行/数据面）；
# 本子镜像自身 = base initrd（mkosi-initrd 默认集）

# initrd 内 repart 需要用户态工具（mkosi-initrd 默认不含）
Packages=systemd-repart