# =============================================================================
# initrd 子镜像 —— 自动被 mkosi 用作主镜像的 initrd（名为 initrd 的子镜像
# 有特殊语义； Include=mkosi-initrd 为官方默认 initrd 配方）。
#
# 职责（overlay 根必须在 initrd 组装，原因见
# mkosi.images/initrd/mkosi.extra/.../initrd-root-overlay.service 头注）：
#   1. systemd-repart 在 initrd 内完成 B/var 分区扩容（此时均未挂载，
#      无在线扩容风险）—— 官方 root-verity.md 同范式
#   2. initrd-root-overlay.service 组装 overlay 全根
# =============================================================================
[Include]
Include=mkosi-initrd

[Content]
# v26 起 initrd 模块默认白名单化（NEWS：modules need to be specified to be
# included）。列出引导全链所需：
#   erofs → lower 层根；btrfs → /var；overlay → 全根增量层
#   vfat/fat/nls → ESP；virtio/ahci/nvme/sd_mod → 测试与真实硬件的根设备
#   crc32c_generic → btrfs 校验和
KernelInitrdModules=erofs btrfs overlay vfat fat nls_cp437 nls_ascii
                   virtio_blk virtio_pci virtio_scsi ahci sd_mod
                   nvme nvme_core crc32c_generic

# initrd 内 repart 需要用户态工具（mkosi-initrd 默认不含）
Packages=systemd-repart