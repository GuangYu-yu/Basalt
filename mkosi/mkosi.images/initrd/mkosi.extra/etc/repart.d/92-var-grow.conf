# var(btrfs) 独占全部剩余空间（root 为 EROFS 不参与增长）。
# 放在 initrd 自身 /etc/repart.d：定义是启动期控制配置，不属 EROFS、也不入 @os；
# 由 systemd-repart.service dropin 显式 --definitions=/etc/repart.d 读取（见 99-console.conf），
# 目标盘经 After=sysroot.mount 定位 /sysroot 的 backing device，两问题解耦。
# GrowFileSystem=yes：repart 设置 GPT GrowFileSystem 位，
# 文件系统扩展由真实根 fstab 的 x-systemd.growfs 完成。
[Partition]
Type=var
Weight=100
GrowFileSystem=yes