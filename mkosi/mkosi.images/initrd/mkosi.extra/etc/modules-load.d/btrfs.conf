# udev 64-btrfs.rules 的 `btrfs ready` 需要 btrfs 模块已加载（ioctl BTRFS_IOC_DEVICES_READY）。
# btrfs 是文件系统，不按设备 modalias 加载；缺失时 ID_BTRFS_READY=0 →
# SYSTEMD_READY=0 → var(btrfs root) device 单元永不激活 → sysroot.mount 超时。
# modules-load.d 于 initrd 早期加载，早于分区 udev 事件。
# 注：mkosi ModulesLoad= 不写入 initrd，须用 mkosi.extra。
btrfs
