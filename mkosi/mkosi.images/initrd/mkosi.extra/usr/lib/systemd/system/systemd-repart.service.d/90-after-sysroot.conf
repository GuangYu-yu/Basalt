# repart 排序到 sysroot.mount 之后：repart 无参数运行时操作 /sysroot 的备份设备
# （var 即 sysroot，须先挂载才能定位 backing 盘）。定义文件改从 initrd 自身的
# /etc/repart.d 读取（99-console.conf 的 --definitions=/etc/repart.d），
# /sysroot 只负责定位目标盘，两问题解耦。
# rescue（basalt.rescue=1）：跳过 repart。rescue 是应急入口，无需/不应扩盘；
# 且 rescue 无 root= → sysroot.mount 不存在 → After= 空排序 → repart 立即执行，
# by-partlabel/var 未就绪（实测 "Failed to open file or determine backing device"
# No such file）→ 失败 → initrd-root-fs.target 卡住 → cleanup 抢跑把正在挂载
# 的 rescue-select SIGTERM → switch-root 失败。门控与 state-bind/sysrw 同款。
[Unit]
After=sysroot.mount
ConditionKernelCommandLine=!basalt.rescue=1