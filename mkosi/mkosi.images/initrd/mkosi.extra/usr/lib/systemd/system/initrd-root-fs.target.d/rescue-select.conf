# rescue 下由本 drop-in 把 rescue-select 拉进 initrd-root-fs.target 完成链
# initrd-root-fs.target 的语义 = /sysroot 根文件系统就绪的同步点；官方 boot
# 流程在它达成后才推进 initrd-fs/initrd.target → cleanup → switch-root。
# rescue 无 root=、无 fstab-generator 生成的 sysroot.mount，rescue-select 是
# /sysroot 唯一提供者——必须 Wants+After 让它完成挂载，initrd-root-fs.target
# 才达成，否则 cleanup 抢跑 SIGTERM 挂载单元（switch-root 缺 os-release）。
# ConditionKernelCommandLine=basalt.rescue=1 在服务内门控，正常 boot 本 Wants
# 拉起的服务因 Condition 不满足即跳过，对正常启动零影响。
[Unit]
Wants=basalt-rescue-select.service
After=basalt-rescue-select.service
