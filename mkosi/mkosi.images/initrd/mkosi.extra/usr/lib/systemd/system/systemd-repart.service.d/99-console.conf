# 排障可见性：systemd-repart 首启扩容失败时 stderr 落串口。
# stock 服务输出走 initrd 内存 journal，quiet loglevel=3 下不转发 console；
# StandardError=journal+console 双写 journal 与 /dev/console（裸 console 非
# 合法取值，systemd 拒绝并忽略）。
#
# --definitions=/etc/repart.d：定义与目标盘解耦。
#   initrd 无参数 repart 默认 definitions 搜索根为 /sysroot（/sysroot/usr/lib/repart.d），
#   而 /sysroot 是目标盘挂载点，repart 默认搜索路径不含其内容 → 定义不可见。
#   显式 --definitions= 从 initrd 自身 /etc/repart.d 读定义，不受 --root/arg_root 重定位。
# After=sysroot.mount（见 90-after-sysroot.conf）仍负责定位目标盘 /sysroot 的 backing device。
# 显式设备：无设备参数时 repart 依赖 /sysroot backing device 探测，失败路径以
# exit 76 退出且被 stock SuccessExitStatus=76 视为成功（var 不增长 → OTA 瞬态
# 写入 EIO）。PARTLABEL=var 为分区布局单一事实源，直接指定。
[Service]
StandardOutput=journal+console
StandardError=journal+console
ExecStart=
# initrd 单次尝试：早期上下文对离线扩盘可见的 usable 仍可能是旧值，
# PADDING=0B 时静默退出且无害；真正的增长由真实根
# systemd-repart.service（/etc/repart.d 定义 + 显式设备）完成，随后
# /var 的 x-systemd.growfs 扩展 btrfs。
ExecStart=/usr/bin/systemd-repart --definitions=/etc/repart.d --dry-run=no /dev/disk/by-partlabel/var