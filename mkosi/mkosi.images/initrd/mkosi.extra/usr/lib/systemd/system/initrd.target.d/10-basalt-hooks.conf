# initrd 钩子激活（mkosi.initrd 无 EnableUnits=/preset 机制，stock
# systemd-repart 靠上游打包的 wants 软链激活——本树无法携带软链，故用
# drop-in Wants= 等价注入；时序约束在各 unit 自身：sysrw Before=
# sysroot.mount、state-bind After=sysroot.mount、rescue-select Before=
# initrd-switch-root.target + cmdline 条件门控）
[Unit]
Wants=basalt-initrd-sysrw.service
       basalt-initrd-state-bind.service
       basalt-rescue-select.service
